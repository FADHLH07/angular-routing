<main class="login-page">
  <section class="login-box">
    <a class="brand" routerLink="/" aria-label="AdminLTE"><strong>Admin</strong>LTE</a>
    <div class="login-card">
      <p class="login-message">Sign in to start your session</p>
      <form (ngSubmit)="signIn()" #loginForm="ngForm">
        <label class="sr-only" for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="Email"
          [(ngModel)]="email" autocomplete="username" required>
        <label class="sr-only" for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Password"
          [(ngModel)]="password" autocomplete="current-password" required>
        <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
        <button type="submit">Sign In</button>
      </form>
      <p class="hint">tugas Angular Routing (Faadhillah destia) 292102779 — isi email dan password apa saja.</p>
    </div>
  </section>
</main>
